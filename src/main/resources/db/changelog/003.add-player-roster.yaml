databaseChangeLog:
  - changeSet:
      id: add-player-roster
      author: SDC
      changes:
        - createTable:
            tableName: ROSTER_ENTRY
            columns:
              - column:
                  name: TOURNAMENT
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    foreignKeyName: FK_ROSTER_ENTRY_TOURNAMENT
                    references: TOURNAMENT(ID)
              - column:
                  name: PLAYER
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    foreignKeyName: FK_ROSTER_ENTRY_PLAYER
                    references: PLAYER(ID)
              - column:
                  name: NICKNAME
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
