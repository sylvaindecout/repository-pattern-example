databaseChangeLog:
  - changeSet:
      id: add-users
      author: SDC
      changes:
        - createTable:
            tableName: PLAYER
            columns:
              - column:
                  name: ID
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: PREFERRED_NICKNAME
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: DATE_OF_BIRTH
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: CITY
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
