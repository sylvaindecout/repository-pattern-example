name: Execute tests

on: [ push ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Run tests with Gradle
        run: ./gradlew test
